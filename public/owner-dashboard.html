<!DOCTYPE html><html><head><title>DemoChat Owner Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#333}.header{background:white;border-bottom:1px solid #e0e0e0;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 4px rgba(0,0,0,.05)}.brand{font-size:22px;font-weight:700}.logout-btn{background:#f0f0f0;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px}.logout-btn:hover{background:#e0e0e0}.container{max-width:1400px;margin:40px auto;padding:0 20px}.tabs{display:flex;gap:20px;margin-bottom:30px;border-bottom:2px solid #f0f0f0}.tab-btn{background:none;border:none;padding:12px 0;font-size:14px;font-weight:600;color:#999;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}.tab-btn.active{color:#667eea;border-bottom-color:#667eea}.tab-content{display:none}.tab-content.active{display:block}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px}.stat-card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.stat-label{font-size:12px;color:#999;text-transform:uppercase;margin-bottom:8px}.stat-value{font-size:32px;font-weight:700;color:#667eea}.table-container{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}.table{width:100%;border-collapse:collapse}.table th{background:#f9f9f9;padding:16px;text-align:left;font-size:12px;font-weight:600;color:#666;text-transform:uppercase;border-bottom:1px solid #e0e0e0}.table td{padding:16px;border-bottom:1px solid #f0f0f0;font-size:14px}.table tr:hover{background:#fafafa}.tenant-name{font-weight:600;color:#333}.email{color:#666;font-size:13px}.status-badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600}.status-active{background:#d4edda;color:#155724}.status-inactive{background:#f8d7da;color:#721c24}.action-btn{background:none;border:1px solid #ddd;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px}.action-btn:hover{background:#667eea;color:white;border-color:#667eea}.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}.modal.show{display:flex}.modal-content{background:white;border-radius:12px;padding:40px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;position:relative}.modal h2{font-size:20px;margin-bottom:20px}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:#333}.form-group input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px}.form-group input:focus{outline:none;border-color:#667eea}.form-buttons{display:flex;gap:12px;margin-top:24px}.btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,.3)}.btn-secondary{background:#f0f0f0;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600}.btn-secondary:hover{background:#e0e0e0}.close-btn{position:absolute;top:20px;right:20px;background:none;border:none;font-size:24px;cursor:pointer}.search-box{margin-bottom:20px}.search-box input{width:100%;max-width:400px;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px}.kb-item{background:#f9f9f9;border-radius:8px;padding:16px;margin-bottom:12px}.kb-name{font-weight:600;margin-bottom:8px}.message{padding:12px;border-radius:6px;margin-bottom:20px;display:none}.message.show{display:block}.message.success{background:#d4edda;color:#155724}.message.error{background:#f8d7da;color:#721c24}</style></head><body><div class="header"><div class="brand">🏢 DemoChat Owner Dashboard</div><button class="logout-btn" id="logoutBtn">Logout</button></div><div class="container"><div class="message" id="message"></div><div class="tabs"><button class="tab-btn active" data-tab="overview">Overview</button><button class="tab-btn" data-tab="tenants">Tenants</button><button class="tab-btn" data-tab="knowledge-bases">Knowledge Bases</button></div><div id="overview" class="tab-content active"><div class="stats-grid" id="statsGrid"></div></div><div id="tenants" class="tab-content"><div class="search-box"><input type="text" id="tenantSearch" placeholder="Search by company name or email..."></div><div class="table-container"><table class="table"><thead><tr><th>Company Name</th><th>Email</th><th>Tenant ID</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody id="tenantsTable"></tbody></table></div></div><div id="knowledge-bases" class="tab-content"><div class="search-box"><input type="text" id="kbSearch" placeholder="Search by company name or KB ID..."></div><div id="kbList"></div></div></div><div class="modal" id="editModal"><div class="modal-content"><button class="close-btn" onclick="closeModal()">✕</button><h2>Edit Tenant Information</h2><form id="editForm"><div class="form-group"><label>Company Name</label><input type="text" id="editCompanyName" required></div><div class="form-group"><label>Email</label><input type="email" id="editEmail" required></div><div class="form-group"><label>Tenant ID (read-only)</label><input type="text" id="editTenantId" readonly style="background:#f9f9f9"></div><div class="form-buttons"><button type="submit" class="btn-primary">Save Changes</button><button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button></div></form></div></div><script>const API_URL='https://krli1mrzr9.execute-api.us-east-1.amazonaws.com';const OWNER_PASSWORD='DemoChat2024!';let allTenants=[];let currentEditingTenant=null;const ownerAuth=sessionStorage.getItem('ownerAuth');if(!ownerAuth){const password=prompt('Enter owner password:');if(password!==OWNER_PASSWORD){alert('Invalid password');window.location.href='/admin-login.html'}else{sessionStorage.setItem('ownerAuth','true')}}async function loadTenants(){try{const response=await fetch(`${API_URL}/admin/tenants`,{method:'GET',headers:{'Content-Type':'application/json'}});if(!response.ok)throw new Error('Failed to load tenants');const data=await response.json();allTenants=data.tenants||[];renderTenants(allTenants);renderStats();renderKnowledgeBases()}catch(error){showMessage(error.message,'error')}}function renderStats(){const totalTenants=allTenants.length;const activeTenants=allTenants.filter(t=>t.status==='active').length;document.getElementById('statsGrid').innerHTML=`<div class="stat-card"><div class="stat-label">Total Tenants</div><div class="stat-value">${totalTenants}</div></div><div class="stat-card"><div class="stat-label">Active Tenants</div><div class="stat-value">${activeTenants}</div></div><div class="stat-card"><div class="stat-label">Total Messages</div><div class="stat-value">Coming Soon</div></div><div class="stat-card"><div class="stat-label">Knowledge Bases</div><div class="stat-value">${totalTenants}</div></div>`}function renderTenants(tenants){const tbody=document.getElementById('tenantsTable');tbody.innerHTML=tenants.map(tenant=>`<tr><td><span class="tenant-name">${tenant.company_name}</span><div class="email">${tenant.email}</div></td><td>${tenant.email}</td><td><code style="background:#f0f0f0;padding:2px 6px;border-radius:4px;font-size:12px">${tenant.tenant_id}</code></td><td><span class="status-badge status-${tenant.status||'active'}">${(tenant.status||'active').toUpperCase()}</span></td><td>${new Date(tenant.created_at).toLocaleDateString()}</td><td><button class="action-btn" onclick="openEditModal('${tenant.tenant_id}','${tenant.company_name}','${tenant.email}')">Edit</button></td></tr>`).join('')}function renderKnowledgeBases(){const kbList=document.getElementById('kbList');kbList.innerHTML=allTenants.map(tenant=>`<div class="kb-item"><div class="kb-name">${tenant.company_name}</div><div style="font-size:12px;color:#666;margin-bottom:8px">KB ID: <code style="background:#f0f0f0;padding:2px 4px;border-radius:3px">${tenant.knowledge_base_id}</code></div><div style="font-size:12px;color:#999">Documents: Loading...</div></div>`).join('')}function openEditModal(tenantId,companyName,email){currentEditingTenant=tenantId;document.getElementById('editTenantId').value=tenantId;document.getElementById('editCompanyName').value=companyName;document.getElementById('editEmail').value=email;document.getElementById('editModal').classList.add('show')}function closeModal(){document.getElementById('editModal').classList.remove('show');currentEditingTenant=null}document.getElementById('editForm').addEventListener('submit',async(e)=>{e.preventDefault();const companyName=document.getElementById('editCompanyName').value;const email=document.getElementById('editEmail').value;try{const response=await fetch(`${API_URL}/admin/tenants/${currentEditingTenant}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({company_name:companyName,email:email})});if(!response.ok)throw new Error('Failed to update tenant');showMessage('Tenant updated successfully','success');closeModal();loadTenants()}catch(error){showMessage(error.message,'error')}});document.querySelectorAll('.tab-btn').forEach(btn=>{btn.addEventListener('click',()=>{const tabName=btn.getAttribute('data-tab');document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));btn.classList.add('active');document.getElementById(tabName).classList.add('active')})});document.getElementById('tenantSearch').addEventListener('input',(e)=>{const query=e.target.value.toLowerCase();const filtered=allTenants.filter(t=>t.company_name.toLowerCase().includes(query)||t.email.toLowerCase().includes(query));renderTenants(filtered)});document.getElementById('kbSearch').addEventListener('input',(e)=>{const query=e.target.value.toLowerCase();const filtered=allTenants.filter(t=>t.company_name.toLowerCase().includes(query)||t.knowledge_base_id.toLowerCase().includes(query));const kbList=document.getElementById('kbList');kbList.innerHTML=filtered.map(tenant=>`<div class="kb-item"><div class="kb-name">${tenant.company_name}</div><div style="font-size:12px;color:#666;margin-bottom:8px">KB ID: <code style="background:#f0f0f0;padding:2px 4px;border-radius:3px">${tenant.knowledge_base_id}</code></div><div style="font-size:12px;color:#999">Documents: Loading...</div></div>`).join('')});function showMessage(text,type){const msg=document.getElementById('message');msg.textContent=text;msg.className=`message show ${type}`;setTimeout(()=>msg.classList.remove('show'),4000)}document.getElementById('logoutBtn').addEventListener('click',()=>{sessionStorage.clear();window.location.href='/admin-login.html'});loadTenants();</script></body></html>
