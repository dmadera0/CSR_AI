<!DOCTYPE html><html><head><title>DemoChat Admin Login</title><style>body{font-family:sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}.login-container{background:white;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:400px;padding:40px;width:90%}.logo-icon{width:50px;height:50px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-size:28px;margin:0 auto 15px}.logo{text-align:center;margin-bottom:30px}.logo h1{font-size:24px;margin:10px 0 5px;color:#333}.logo p{color:#666;margin:0}.form-group{margin-bottom:20px}label{display:block;font-weight:600;margin-bottom:8px;font-size:14px;color:#333}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:14px}input:focus{outline:0;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1)}.submit-btn{width:100%;padding:12px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}.submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,.3)}.error-message{background-color:#fee;color:#c00;padding:12px;border-radius:6px;margin-bottom:20px;font-size:14px;display:none}.error-message.show{display:block}.divider{text-align:center;margin:25px 0;font-size:14px;color:#999}.signup-link{text-align:center;font-size:14px;color:#666}.signup-link a{color:#667eea;text-decoration:none;font-weight:600}</style></head><body><div class="login-container"><div class="logo"><div class="logo-icon">💬</div><h1>DemoChat</h1><p>Admin Dashboard</p></div><div class="error-message" id="errorMessage"></div><form id="loginForm"><div class="form-group"><label for="email">Email Address</label><input type="email" id="email" placeholder="admin@yourdomain.com" required></div><div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="••••••••" required></div><button type="submit" class="submit-btn">Sign In</button></form><div class="divider">or</div><div class="signup-link">Don't have an account? <a href="/signup.html">Create one free</a></div></div><script>const API_URL='https://krli1mrzr9.execute-api.us-east-1.amazonaws.com';document.getElementById('loginForm').addEventListener('submit',async(e)=>{e.preventDefault();const email=document.getElementById('email').value;const password=document.getElementById('password').value;const errorMsg=document.getElementById('errorMessage');errorMsg.classList.remove('show');try{const response=await fetch(`${API_URL}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await response.json();if(!response.ok)throw new Error(data.error);sessionStorage.setItem('tenantId',data.tenant_id);sessionStorage.setItem('knowledgeBaseId',data.knowledge_base_id);sessionStorage.setItem('companyName',data.company_name);sessionStorage.setItem('userEmail',data.email);window.location.href='/admin-dashboard.html'}catch(error){errorMsg.textContent=error.message;errorMsg.classList.add('show')}});</script></body></html>
