<head>

  <title>DemoChat Widget — Dev</title>
  <style>
    body { font-family: sans-serif; background: #f1f5f9; color: #334155;

    h1   { color: #1e293b; }

  <h1>DemoChat Widget Dev Server</h1>
  <p>
    This page is only used during <code>npm run dev</code>. To test the

  </p>
  <p>
    <strong>Quick test:</strong><br>
    <code>cd widget && npm run build</code><br>
    <code>python3 -m http.server 8000</code><br>
    Then visit <code>http://localhost:8000/test.html</code>
  </p>
